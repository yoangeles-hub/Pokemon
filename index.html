<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enciclopedia Luxury Pokémon Tipo Planta</title>
    <!-- Fuente elegante Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="pokemon.css">
</head>
<body>

    <header class="luxury-header">
        <div class="logo-container">
            <span class="leaf-icon">🌿</span>
            <h1>COLECCIÓN LUXURY</h1>
            <p>Pokémon Tipo Planta / Hierba</p>
        </div>
    </header>

    <!-- Contenedor Principal del Carrusel -->
    <section class="carousel-wrapper">
        <button class="carousel-btn prev-btn" id="prevBtn" aria-label="Anterior">&#10094;</button>
        
        <div class="carousel-track-container">
            <main class="gallery-container carousel-track" id="pokemon-gallery">
                <!-- Las cartas se generarán dinámicamente con JS -->
            </main>
        </div>

        <button class="carousel-btn next-btn" id="nextBtn" aria-label="Siguiente">&#10095;</button>
    </section>

    <!-- Indicadores de Puntos (Dots) -->
    <div class="carousel-dots" id="carouselDots"></div>

    <footer>
        <p>&copy; 2026 Colección Élite Pokémon JCC. Todos los derechos reservados.</p>
    </footer>

    <script src="pokemon.js"></script>
</body>
 </html>
